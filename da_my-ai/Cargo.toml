[workspace]
resolver = "2"
members = ["core", "cli", "dash", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Diego Nepomuceno Marcos"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
my-ai-core = { path = "core" }
