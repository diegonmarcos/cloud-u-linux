<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-ai</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">my-ai</div>
      <div class="launch">
        <button data-face="remote" class="btn primary">remote</button>
        <button data-face="local" class="btn">local</button>
        <button data-face="claude" class="btn">claude</button>
        <span class="sep"></span>
        <label>restore <input id="restoreN" type="number" min="1" value="5" /></label>
        <button id="restoreBtn" class="btn">restore</button>
        <button id="syncBtn" class="btn">sync</button>
        <span class="sep"></span>
        <button id="refreshBtn" class="btn ghost">↻ refresh</button>
        <span id="status" class="status"></span>
      </div>
    </header>
    <main id="grid"></main>
    <script src="app.js"></script>
  </body>
</html>
