[package]
name = "da-autofill-rbw-rofi"
version = "0.1.0"
edition = "2021"
description = "System-wide hotkey password autofill via rbw + rofi/wofi + wtype/xdotool."
license = "MIT OR Apache-2.0"

[[bin]]
name = "da_autofill-rbw-rofi"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "process", "io-util", "io-std", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
