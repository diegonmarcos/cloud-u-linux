name: ship-c3-watchdog
# Build c3-watchdog — the machine sampler, split out of my-konsole into its own
# product. Plain std+libc+ksni, so unlike ship-my-konsole-app.yml this needs no
# nix, no webkitgtk and no node: stable rust and the D-Bus headers ksni links
# against are the whole toolchain, and the job finishes in a couple of minutes
# instead of twenty.
#
# It builds here rather than on the laptop for the same reason everything else
# does — the freeze-guard exists because Rust link steps are what put that
# machine on the floor.
on:
  push:
    branches: [main]
    paths:
      - 'da_c3-watchdog/**'
      # NEGATED HERE, not in paths-ignore: GitHub rejects a workflow that uses
      # both keys for one event, and it rejects it as "a workflow file issue"
      # with a 0-second run and the FILE PATH where the workflow name should
      # be — no YAML error, because the YAML is fine. Three watchdog pushes
      # built nothing before that was spotted.
      #
      # The exclusion matters: the pin job commits this file back after
      # publishing, and without it every release would trigger the build that
      # writes it, forever.
      - '!da_c3-watchdog/nix/hashes.json'
      - '.github/workflows/ship-c3-watchdog.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write   # ghcr.io/diegonmarcos/c3-watchdog

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da_c3-watchdog
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: da_c3-watchdog

      # ksni talks StatusNotifierItem over D-Bus and links against libdbus.
      - name: D-Bus headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config

      # clippy before the build: this crate is the safety boundary for every
      # kill, restart and unit verb the panel can ask for, and a warning here
      # is worth stopping for.
      - name: Compile-verify
        run: |
          cargo fmt --check || true
          # --features tui, or the panel is not checked at all: its binary
          # declares required-features, so --all-targets skips it silently and
          # 11k lines of moved code would go out unverified.
          cargo clippy --release --all-targets --features tui -- -D warnings
          cargo test --release --features tui

      # The lock is a BUILD INPUT, not a build output: the nix flake packages
      # this crate with cargoLock.lockFile, which needs a committed lock to
      # point at. Uploaded so it can be committed once; after that `--locked`
      # below keeps it honest and this step is just a way to recover it.
      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: da_c3-watchdog/Cargo.lock
          if-no-files-found: error

      - name: Build
        # Desktop gets the daemon AND the panel. The fleet leg below builds
        # neither the tray nor the tui — see its own comment for why that
        # matters more than one artifact would.
        run: cargo build --release --features tui

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view c3-watchdog-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create c3-watchdog-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "c3-watchdog (rolling)" \
              --notes "The machine sampler and its panel. Rebuilt on every push to da_c3-watchdog/."
          # The phone app's UI, generated from the same template as the
          # report and carried inside the APK. Emitted here rather than
          # fetched at runtime: an app that downloads its own interface
          # before it can draw shows nothing on a train.
          ./target/release/c3-watchdog-tui app-shell > c3-watchdog-app.html
          gh release upload c3-watchdog-latest \
            target/release/c3-watchdog-d \
            target/release/c3-watchdog-tui \
            c3-watchdog-app.html \
            --repo "$GITHUB_REPOSITORY" --clobber
          # THE OLD NAMES, FOR ONE CYCLE. Installers already deployed on the
          # fleet ask for my-watchdog / my-watchdog-tui by name — they would
          # fetch a 404 and report it as "no release", which is
          # indistinguishable from CI being down. Publishing both means the
          # rename lands on a machine when that machine next updates, in either
          # order, instead of all at once.
          #
          # The c3-watchdog rebrand moved the TAG too (my-watchdog-latest ->
          # c3-watchdog-latest), so these carry a consumer that flips the tag
          # before it flips the asset name. The old release still exists and
          # still serves the un-flipped fleet until the consumers move.
          # Delete these two lines once nothing asks for them.
          cp target/release/c3-watchdog-d my-watchdog
          cp target/release/c3-watchdog-tui my-watchdog-tui
          gh release upload c3-watchdog-latest my-watchdog my-watchdog-tui \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The fleet build. Static musl, no tray: a headless VM has no tray to put an
  # icon on, and dropping ksni drops libdbus with it — which is exactly the
  # dependency that stops a binary being statically linked. A static-musl
  # binary makes raw syscalls instead of linking the host libc, so one artifact
  # per architecture runs on Ubuntu, Fedora and NixOS alike, which is what this
  # fleet actually is.
  fleet:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners, no QEMU: cross-compiling a musl target is a linker
          # flag, and emulating a whole toolchain to avoid one is a bad trade.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: c3-watchdog-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: c3-watchdog-aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: da_c3-watchdog
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build without the tray
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      # THE PANEL, PER ARCHITECTURE.
      #
      # Its own artifact rather than adding --features tui to the line above:
      # that binary ships to every VM in the fleet and they are headless, so
      # linking ratatui into it would triple the thing that has to stay small
      # to carry a UI no server will draw. --no-default-features keeps the tray
      # out; a phone has no D-Bus session either.
      #
      # BOTH ARCHITECTURES NOW. This was arm-only, on the reasoning that
      # nothing x86_64 asked for a musl panel — true while the only consumer
      # was a phone. The terminal forks are built per ABI like every other app
      # here, and the x86_64 APK carries these binaries too, so an arm-only
      # panel would ship an x86 terminal that cannot draw a dashboard.
      - name: Build the panel
        run: |
          cargo build --release --no-default-features --features tui \
            --bin c3-watchdog-tui --target ${{ matrix.target }}
          # Named off matrix.asset so the pair always agrees: c3-watchdog-X and
          # c3-watchdog-tui-X are the same build for the same architecture.
          cp "target/${{ matrix.target }}/release/c3-watchdog-tui" \
             "$(echo '${{ matrix.asset }}' | sed 's/^c3-watchdog-/c3-watchdog-tui-/')"

      - name: Confirm it is actually static
        # A dynamically linked "static" build fails on the first peer with a
        # different libc, and it fails there rather than here — so check here.
        run: |
          f="target/${{ matrix.target }}/release/c3-watchdog-d"
          file "$f"
          file "$f" | grep -q 'static' || { echo "NOT static — it would not run on the fleet" >&2; exit 1; }

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/${{ matrix.target }}/release/c3-watchdog-d ${{ matrix.asset }}
          gh release view c3-watchdog-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create c3-watchdog-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "c3-watchdog (rolling)" \
              --notes "The machine sampler and its panel. Rebuilt on every push to da_c3-watchdog/."
          gh release upload c3-watchdog-latest \
            ${{ matrix.asset }} \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Both legs produce one now, so this is unconditional. It used to
          # be guarded because only the arm leg built a panel — a guard that
          # would silently keep publishing one architecture if the build step
          # above ever stopped producing the other.
          tui="$(echo '${{ matrix.asset }}' | sed 's/^c3-watchdog-/c3-watchdog-tui-/')"
          gh release upload c3-watchdog-latest "$tui" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ── the pin ──────────────────────────────────────────────────────────────
  # WHAT MAKES THE NIX PATH TRUE. nix/prebuilt.nix installs the static assets
  # published above instead of compiling — that is the only reason a two-core
  # VM can run this at all — and fetchurl needs a fixed hash. So the hash of
  # what was just uploaded has to come back into the repository, or every
  # consumer keeps installing the previous build behind a stale hash.
  #
  # This is the seam between the builder and everyone else: after it lands, a
  # machine updates by bumping flake.lock — reviewable, atomic, roll-back-able
  # — rather than by re-downloading a rolling tag that changed underneath it.
  # A tag that moves without this commit is exactly how a laptop ran a
  # three-week-old binary through four green deploys.
  #
  # No nix on the runner: an SRI hash is base64 of the raw sha256 digest, and
  # sha256sum + xxd + base64 are already here.
  pin:
    needs: fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit below needs a real branch, not the detached head that
          # actions/checkout leaves by default.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hash the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd da_c3-watchdog
          sri() {
            gh release download c3-watchdog-latest --repo "$GITHUB_REPOSITORY" \
              --pattern "$1" --output "/tmp/$1" --clobber
            h="$(sha256sum "/tmp/$1" | cut -d' ' -f1)"
            printf 'sha256-%s' "$(printf '%s' "$h" | xxd -r -p | base64 -w0)"
          }
          jq -n \
            --arg x64d "$(sri c3-watchdog-x86_64)"      --arg x64t "$(sri c3-watchdog-tui-x86_64)" \
            --arg a64d "$(sri c3-watchdog-aarch64)"     --arg a64t "$(sri c3-watchdog-tui-aarch64)" \
            '{
              _comment: "Written by ship-c3-watchdog.yml. The static musl assets, per arch — the pair a consumer installs without a compiler. Same convention as da_my-ai/nix/hashes.json.",
              tag: "c3-watchdog-latest",
              version: "latest",
              "x86_64-linux": {
                "c3-watchdog-d":   { asset: "c3-watchdog-x86_64",     hash: $x64d },
                "c3-watchdog-tui": { asset: "c3-watchdog-tui-x86_64", hash: $x64t }
              },
              "aarch64-linux": {
                "c3-watchdog-d":   { asset: "c3-watchdog-aarch64",     hash: $a64d },
                "c3-watchdog-tui": { asset: "c3-watchdog-tui-aarch64", hash: $a64t }
              }
            }' > nix/hashes.json

      - name: Commit the pin
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only this path. Other sessions and other jobs share this branch,
          # and `git add -A` here would carry whatever else the runner touched.
          git add da_c3-watchdog/nix/hashes.json
          git diff --cached --quiet && { echo "pin unchanged"; exit 0; }
          git commit -m "da_c3-watchdog: pin the published static assets [ci skip]"
          # Rebase, never force: another push may have landed while the fleet
          # job was building.
          git pull --rebase origin main
          git push origin HEAD:main

      # THE TARBALL, BUILT AFTER THE PIN AND NEVER BEFORE. packages.dist reads
      # nix/hashes.json to fetch the very binaries this run published, so
      # building it earlier would package the previous release. This is also
      # the only step that needs nix on a runner: the c3-watchdog.service it
      # carries is RENDERED from nix/watchdog-service.nix, the same expression
      # the NixOS and home-manager modules render — which is what stops a
      # Debian box and a NixOS laptop running units that disagree.
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Build and publish the dist tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nix build ./da_c3-watchdog#dist --out-link /tmp/dist
          cp /tmp/dist/c3-watchdog-dist.tar.gz .
          gh release upload c3-watchdog-latest c3-watchdog-dist.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ── the container ────────────────────────────────────────────────────────
  # The third way in. The flake covers NixOS, the release binary covers anyone
  # who can download a file, and this covers a box where the only thing you can
  # rely on is that it runs containers.
  #
  # AFTER the fleet job, not beside it: the image is a wrapper around the static
  # musl binaries that job publishes, so building in parallel would race the
  # upload and bake whichever artifact happened to be there.
  image:
    needs: fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The guard lives in the action, not here. A check you have to remember
      # to copy into the next ship workflow is a check the next ship workflow
      # will not have.
      - name: Publish to GHCR
        uses: ./.github/actions/ghcr-publish
        with:
          # -server, NOT c3-watchdog. cloud-u-android ships the phone app as an
          # OCI artifact to ghcr.io/diegonmarcos/c3-watchdog, and GHCR package
          # names are per-account, not per-repo: before the rebrand these were
          # my-watchdog and cloud-watchdog and could not collide, but rebranding
          # both to c3-watchdog put a Docker image and an APK in one package,
          # where whichever shipped last owned :latest. The updater pulls that
          # tag expecting an APK.
          image: c3-watchdog-server
          namespace: diegonmarcos
          context: da_c3-watchdog
          file: da_c3-watchdog/Dockerfile
          platforms: linux/amd64,linux/arm64
          token: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/diegonmarcos/c3-watchdog:latest
            ghcr.io/diegonmarcos/c3-watchdog:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Machine sampler and TUI panel
            org.opencontainers.image.licenses=MIT
