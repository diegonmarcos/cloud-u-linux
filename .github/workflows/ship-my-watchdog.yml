name: ship-my-watchdog
# Build my-watchdog — the machine sampler, split out of my-konsole into its own
# product. Plain std+libc+ksni, so unlike ship-my-konsole-app.yml this needs no
# nix, no webkitgtk and no node: stable rust and the D-Bus headers ksni links
# against are the whole toolchain, and the job finishes in a couple of minutes
# instead of twenty.
#
# It builds here rather than on the laptop for the same reason everything else
# does — the freeze-guard exists because Rust link steps are what put that
# machine on the floor.
on:
  push:
    branches: [main]
    paths:
      - 'da_watchdog/**'
      - '.github/workflows/ship-my-watchdog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da_watchdog
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: da_watchdog

      # ksni talks StatusNotifierItem over D-Bus and links against libdbus.
      - name: D-Bus headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config

      # clippy before the build: this crate is the safety boundary for every
      # kill, restart and unit verb the panel can ask for, and a warning here
      # is worth stopping for.
      - name: Compile-verify
        run: |
          cargo fmt --check || true
          # --features tui, or the panel is not checked at all: its binary
          # declares required-features, so --all-targets skips it silently and
          # 11k lines of moved code would go out unverified.
          cargo clippy --release --all-targets --features tui -- -D warnings
          cargo test --release --features tui

      - name: Build
        # Desktop gets the daemon AND the panel. The fleet leg below builds
        # neither the tray nor the tui — see its own comment for why that
        # matters more than one artifact would.
        run: cargo build --release --features tui

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view my-watchdog-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create my-watchdog-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "my-watchdog (rolling)" \
              --notes "The machine sampler and its panel. Rebuilt on every push to da_watchdog/."
          # The phone app's UI, generated from the same template as the
          # report and carried inside the APK. Emitted here rather than
          # fetched at runtime: an app that downloads its own interface
          # before it can draw shows nothing on a train.
          ./target/release/my-watchdog-tui app-shell > watchdog-app.html
          gh release upload my-watchdog-latest \
            target/release/my-watchdog \
            target/release/my-watchdog-tui \
            watchdog-app.html \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The fleet build. Static musl, no tray: a headless VM has no tray to put an
  # icon on, and dropping ksni drops libdbus with it — which is exactly the
  # dependency that stops a binary being statically linked. A static-musl
  # binary makes raw syscalls instead of linking the host libc, so one artifact
  # per architecture runs on Ubuntu, Fedora and NixOS alike, which is what this
  # fleet actually is.
  fleet:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners, no QEMU: cross-compiling a musl target is a linker
          # flag, and emulating a whole toolchain to avoid one is a bad trade.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: my-watchdog-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: my-watchdog-aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: da_watchdog
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build without the tray
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      # THE PANEL, PER ARCHITECTURE.
      #
      # Its own artifact rather than adding --features tui to the line above:
      # that binary ships to every VM in the fleet and they are headless, so
      # linking ratatui into it would triple the thing that has to stay small
      # to carry a UI no server will draw. --no-default-features keeps the tray
      # out; a phone has no D-Bus session either.
      #
      # BOTH ARCHITECTURES NOW. This was arm-only, on the reasoning that
      # nothing x86_64 asked for a musl panel — true while the only consumer
      # was a phone. The terminal forks are built per ABI like every other app
      # here, and the x86_64 APK carries these binaries too, so an arm-only
      # panel would ship an x86 terminal that cannot draw a dashboard.
      - name: Build the panel
        run: |
          cargo build --release --no-default-features --features tui \
            --bin my-watchdog-tui --target ${{ matrix.target }}
          # Named off matrix.asset so the pair always agrees: my-watchdog-X and
          # my-watchdog-tui-X are the same build for the same architecture.
          cp "target/${{ matrix.target }}/release/my-watchdog-tui" \
             "$(echo '${{ matrix.asset }}' | sed 's/^my-watchdog-/my-watchdog-tui-/')"

      - name: Confirm it is actually static
        # A dynamically linked "static" build fails on the first peer with a
        # different libc, and it fails there rather than here — so check here.
        run: |
          f="target/${{ matrix.target }}/release/my-watchdog"
          file "$f"
          file "$f" | grep -q 'static' || { echo "NOT static — it would not run on the fleet" >&2; exit 1; }

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/${{ matrix.target }}/release/my-watchdog ${{ matrix.asset }}
          gh release view my-watchdog-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create my-watchdog-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "my-watchdog (rolling)" \
              --notes "The machine sampler and its panel. Rebuilt on every push to da_watchdog/."
          gh release upload my-watchdog-latest \
            ${{ matrix.asset }} \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Both legs produce one now, so this is unconditional. It used to
          # be guarded because only the arm leg built a panel — a guard that
          # would silently keep publishing one architecture if the build step
          # above ever stopped producing the other.
          tui="$(echo '${{ matrix.asset }}' | sed 's/^my-watchdog-/my-watchdog-tui-/')"
          gh release upload my-watchdog-latest "$tui" \
            --repo "$GITHUB_REPOSITORY" --clobber
