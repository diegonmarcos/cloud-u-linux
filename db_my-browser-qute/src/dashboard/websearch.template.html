<!--
  GENERATED by src/dashboard/gen-dashboard.sh — do not edit dist/qute-websearch.html.
  Edit THIS template, or the engine list in src/2_configs/qute-search-engines.json,
  then re-run the generator.

  One query box, every configured search engine stacked below it. Pick an engine
  with the arrow keys (or click it), hit Enter, and the results open in a NEW TAB
  via window.open(url,'_blank') — the same call the bookmarks dashboard already
  uses, so it is known to work under my-browser-qute's popup policy.

  The engine list is NOT hardcoded: it is injected from qute-search-engines.json,
  the same file that feeds c.url.searchengines. Add an engine there and it appears
  here on the next generator run.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web search</title>
<style>
  :root{
    --fg:#eef2f8; --muted:#aab6c8; --hi:#fff;
    --dnm:#3b82f6; --priv:#a855f7; --svc:#f59e0b; --local:#10b981;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    color:var(--fg);
    font:14px/1.45 'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 900px at 12% 8%, #4338ca55, transparent 55%),
      radial-gradient(1000px 800px at 92% 12%, #9333ea4d, transparent 55%),
      radial-gradient(900px 900px at 70% 100%, #0ea5e94d, transparent 55%),
      linear-gradient(160deg,#0b1020,#0a0d17 60%,#0b1020);
    min-height:100vh; overflow-x:hidden;
  }
  header{display:flex;align-items:center;gap:16px;padding:22px clamp(18px,5vw,64px) 10px}
  header .brand{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted)}
  header .spacer{flex:1}
  header #clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  main{padding:0 clamp(18px,5vw,64px) 40px;max-width:900px;margin:0 auto}

  /* the single query box — one query, then choose the engine */
  .qwrap{position:relative;margin:10px 0 22px}
  #q{
    width:100%;padding:18px 20px;border-radius:16px;
    border:1px solid #ffffff1f;background:#ffffff0d;color:var(--hi);
    font:inherit;font-size:18px;outline:none;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  #q::placeholder{color:#ffffff4d}
  #q:focus{border-color:#ffffff40;background:#ffffff14}

  ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  li{
    display:flex;align-items:center;gap:14px;
    padding:13px 16px;border-radius:14px;cursor:pointer;
    border:1px solid #ffffff14;background:#ffffff08;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:background .12s,border-color .12s;
  }
  li:hover{background:#ffffff12}
  li[aria-selected="true"]{
    background:#ffffff1a;border-color:var(--dnm);
    box-shadow:0 0 0 1px #3b82f655, 0 8px 24px #0006;
  }
  .key{
    flex:0 0 auto;min-width:62px;text-align:center;
    padding:4px 9px;border-radius:8px;font-size:12px;font-weight:700;
    background:#3b82f62e;color:#bfd4ff;border:1px solid #3b82f647;
  }
  li[data-default="1"] .key{background:#10b9812e;color:#a7f3d0;border-color:#10b98147}
  .host{flex:0 0 auto;font-size:15px;color:var(--hi)}
  .tmpl{flex:1;min-width:0;font-size:12px;color:var(--muted);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--local)}

  footer{padding:6px clamp(18px,5vw,64px) 30px;max-width:900px;margin:0 auto;
         font-size:12px;color:var(--muted)}
  kbd{background:#ffffff14;border:1px solid #ffffff26;border-radius:6px;
      padding:1px 6px;font:inherit;font-size:11px;color:var(--hi)}
  .empty{padding:20px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="brand">web search</div>
  <div class="spacer"></div>
  <div id="clock"></div>
</header>

<main>
  <div class="qwrap">
    <input id="q" autofocus autocomplete="off" spellcheck="false"
           placeholder="type a query, pick an engine below, press Enter">
  </div>
  <ul id="list"></ul>
</main>

<footer>
  <kbd>&uarr;</kbd><kbd>&darr;</kbd> choose engine &middot;
  <kbd>Enter</kbd> open results in a new tab &middot;
  <kbd>Esc</kbd> clear &middot;
  empty query opens the engine's home page
</footer>

<script>
const ENGINES = __ENGINES_JSON__;

const list = document.getElementById('list');
const q = document.getElementById('q');
let sel = Math.max(0, ENGINES.findIndex(e => e.is_default));

function render(){
  if(!ENGINES.length){
    list.innerHTML = '<li class="empty">No engines in qute-search-engines.json.</li>';
    return;
  }
  list.innerHTML = '';
  ENGINES.forEach((e, i) => {
    const li = document.createElement('li');
    li.setAttribute('aria-selected', i === sel ? 'true' : 'false');
    if(e.is_default) li.dataset.default = '1';
    li.innerHTML =
      '<span class="key"></span><span class="host"></span>' +
      '<span class="tmpl"></span>';
    li.children[0].textContent = e.key;
    li.children[1].textContent = e.host;
    li.children[2].textContent = e.is_default ? 'default engine' : e.url;
    if(e.is_default) li.children[2].className = 'tmpl tag';
    li.addEventListener('click', () => { sel = i; render(); go(); });
    list.appendChild(li);
  });
}

function move(d){
  if(!ENGINES.length) return;
  sel = (sel + d + ENGINES.length) % ENGINES.length;
  render();
  list.children[sel].scrollIntoView({block:'nearest'});
}

function go(){
  const e = ENGINES[sel];
  if(!e) return;
  const t = q.value.trim();
  // Empty query -> the engine's own home page, so the row is still useful
  // as a plain "take me to duckduckgo" launcher.
  const url = t ? e.url.replace('{}', encodeURIComponent(t)) : e.origin;
  window.open(url, '_blank');
}

document.addEventListener('keydown', ev => {
  if(ev.key === 'ArrowDown' || (ev.key === 'Tab' && !ev.shiftKey)){ ev.preventDefault(); move(1); }
  else if(ev.key === 'ArrowUp' || (ev.key === 'Tab' && ev.shiftKey)){ ev.preventDefault(); move(-1); }
  else if(ev.key === 'Enter'){ ev.preventDefault(); go(); }
  else if(ev.key === 'Escape'){ q.value = ''; q.focus(); }
  // ponytail: no j/k bindings — they would be swallowed by the query box, which
  // is focused by design. Arrows and Tab work whether or not it has focus.
});

const clk = document.getElementById('clock');
const tick = () => { clk.textContent = new Date().toTimeString().slice(0,5); };
tick(); setInterval(tick, 10000);

render();
q.focus();
</script>
</body>
</html>
