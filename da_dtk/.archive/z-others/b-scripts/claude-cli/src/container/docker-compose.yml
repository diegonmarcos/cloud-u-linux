services:
  claude:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    volumes:
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.claude.json:/home/node/.claude.json:ro
      - .:/workspace
    working_dir: /workspace
    environment:
      - CLAUDE_CONFIG_DIR=/home/node/.claude
