<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my-watchdog</title>
  <link rel="stylesheet" href="watchdog.css">
</head>
<body>
  <button class="hamburger" id="hamburger" aria-label="Toggle sidebar">&#9776;</button>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 id="host-name">my-watchdog</h2>
      <button class="close-btn" id="close-btn">&times;</button>
    </div>
    <section class="sidebar-section">
      <h3>Host</h3>
      <ul id="host-info"></ul>
    </section>
    <section class="sidebar-section">
      <h3>Pressure</h3>
      <ul id="pressure-info"></ul>
    </section>
    <section class="sidebar-section">
      <h3>Docker</h3>
      <ul id="docker-info"></ul>
    </section>
    <section class="sidebar-section">
      <h3>Listening</h3>
      <ul id="listening-list"></ul>
    </section>
    <section class="sidebar-section">
      <h3>Data</h3>
      <ul>
        <li><a href="/__api__/watchdog" target="_blank">watchdog-live.json</a></li>
      </ul>
    </section>
  </nav>
  <main class="content">
    <div class="status-bar">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">connecting&hellip;</span>
    </div>
    <div class="panels">
      <section class="panel">
        <h3>Processes <span class="muted" id="proc-count"></span></h3>
        <div class="scroll"><table id="procs"></table></div>
      </section>
      <section class="panel">
        <h3>Containers <span class="muted" id="ctr-count"></span></h3>
        <div class="scroll"><table id="containers"></table></div>
      </section>
      <section class="panel">
        <h3>Images <span class="muted" id="img-count"></span></h3>
        <div class="scroll"><table id="images"></table></div>
      </section>
    </div>
  </main>
  <script src="watchdog.js.json"></script>
  <script src="watchdog.js"></script>
</body>
</html>
