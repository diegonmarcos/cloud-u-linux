[package]
name = "my-konsole"
version = "0.1.0"
edition = "2021"
description = "my-konsole — Rust KDE Konsole alternative (Tauri v2)"
authors = ["Diego Nepomuceno Marcos"]
license = "MIT"

[[bin]]
name = "my-konsole"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOT tauri's "tray-icon" feature: on Linux tray-icon builds each tray via
# AppIndicator::new(..., "") and drops the `tooltip` field entirely (it is
# documented Unsupported on that platform), so every tray showed the app name
# on hover instead of its own title. ksni implements StatusNotifierItem
# directly over D-Bus, including the ToolTip property KDE actually reads.
tauri = { version = "2", features = ["unstable"] }
# In-tab embedded browser (Linux): tauri's own add_child packs child webviews
# into the window's GtkBox where wry's set_bounds is a no-op (tauri#13071 /
# wry#1727). We bypass it: a GtkOverlay + GtkFixed of our own over the main
# webview, with wry webviews built via build_gtk(&fixed) — is_in_fixed_parent
# makes geometry actually work. gtk + wry are ALREADY in the tree via tauri
# (lock: gtk 0.18.2, wry 0.55.1) — declaring them adds no new native deps.
gtk = "0.18"
wry = "0.55"
tauri-plugin-shell = "2"
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pty-core = { path = "../pty-core" }
# ponytail: no my-watchdog dependency. The sampler is a separate product with
# its own process, and this app is a consumer of the file it publishes — the
# only coupling is that file's shape, which is what makes the split real
# rather than cosmetic.
# ponytail: PTY logic lives in the shared pty-core crate — no bundled node/pty-server.
tiny_http = "0.12"
# PNG -> raw RGBA decode for tray icons (tauri::image::Image has no from_path
# in this version — see setup_systrays in main.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
# Per-tray icons are SVGs (configs/systray-icons/<id>.svg) rasterised at load.
# Rasterising here rather than shipping PNGs keeps ONE source per icon: a PNG
# pair would be a generated file to regenerate by hand every time, and the
# alternative — imagemagick at install time — puts a build tool on every user
# machine for six 32x32 images.
resvg = { version = "0.44", default-features = false }
# Directory walk for the sidebar "Data" panel (fs_glob below) — filter_entry
# prunes a subtree BEFORE descending into it, which the `glob` crate this
# replaced could not do (it filtered .git/target/node_modules/result out of
# the *results*, after already walking every one of them in full).
walkdir = "2"
# statvfs for the watchdog's root-filesystem percentage — Rust std has no
# equivalent, and one FFI call every 2s beats forking df.
libc = "0.2"
# Serves the vendored agentic-ui/dist static build to the native browser-tab
# webview (browser_open needs a real http:// URL, not a file:// root) — see
# agentic_ui_serve below. Smallest workable dep for this, per plan.

[profile.release]
strip = true
lto = true
codegen-units = 1
