[package]
name = "my-konsole-dash"
version = "0.1.0"
edition = "2021"
description = "my-konsole dashboards — ratatui TUIs (render in-terminal + bare TTY)"

[[bin]]
name = "my-konsole-dash"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = 2
